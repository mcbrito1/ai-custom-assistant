services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-agent
    restart: unless-stopped

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      INTENT_MODEL: ${INTENT_MODEL:-qwen2.5:1.5b}
      REASONING_MODEL: ${REASONING_MODEL:-deepseek-r1:1.5b}
      CODE_MODEL: ${CODE_MODEL:-qwen2.5-coder:1.5b}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHONUNBUFFERED: "1"
      MEMORY_FILE: /app/data/memory.json
      TASKS_FILE: /app/data/tasks.json
      OBSIDIAN_VAULT: /obsidian
      HERMES_TAG_SCAN_INTERVAL: ${HERMES_TAG_SCAN_INTERVAL:-60}
      HISTORY_FILE: /app/data/history.json
      VAULT_INDEX_FILE: /app/data/vault_index.json
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_SIMILARITY_THRESHOLD: ${EMBED_SIMILARITY_THRESHOLD:-0.3}
      MORNING_BRIEFING_CRON: ${MORNING_BRIEFING_CRON:-0 8 * * *}
      PROJECT_SCAN_INTERVAL: ${PROJECT_SCAN_INTERVAL:-3600}
      PROJECT_STALE_DAYS: ${PROJECT_STALE_DAYS:-7}
      MAX_IMPROVE_ITERATIONS: ${MAX_IMPROVE_ITERATIONS:-2}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-3}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * 0}
      WEEKLY_REFLECTION_CRON: ${WEEKLY_REFLECTION_CRON:-0 22 * * 6}
      BEHAVIOR_FILE: /app/data/behavior.json
      FACT_STALE_DAYS: ${FACT_STALE_DAYS:-30}
      CONV_INDEX_FILE: /app/data/conversation_index.json
      AUTO_SUMMARIZE_THRESHOLD: ${AUTO_SUMMARIZE_THRESHOLD:-1000}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-5}
      GOOGLE_CREDS_PATH: /app/data/google_credentials.json
      GOOGLE_TOKEN_PATH: /app/data/google_token.json
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      ACTIVITY_FILE: /app/data/activity_log.json
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID}

    volumes:
      - ./data:/app/data
      - C:\Git\Obsidian:/obsidian

    ports:
      - "${HERMES_PORT:-8000}:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - hermes-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  hermes-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-bot
    restart: unless-stopped
    command: ["python", "bot.py"]

    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID}
      HOST_AGENT_URL: ${HOST_AGENT_URL:-http://host.docker.internal:9000/exec}
      HOST_AGENT_SECRET: ${HOST_AGENT_SECRET}
      HERMES_URL: http://hermes:8000/chat
      PYTHONUNBUFFERED: "1"

    depends_on:
      hermes:
        condition: service_healthy

    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
